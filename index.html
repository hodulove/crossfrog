<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>근육 개구리 · ROAD RAGE</title><style>*{box-sizing:border-box}body{margin:0;background:#101b20;color:#f2f5e9;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}#app{max-width:850px;margin:auto;height:100dvh;display:flex;flex-direction:column}header{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0;letter-spacing:-1px}small{display:block;font-size:10px;letter-spacing:3px;color:#b9f377;margin-bottom:4px}.tag{font-size:11px;color:#acb6b5;border:1px solid #40504c;border-radius:30px;padding:8px 12px}.hud{display:flex;gap:14px;align-items:center;padding:0 20px 12px;font-size:12px}.track{flex:1;height:8px;background:#324239;border-radius:8px;overflow:hidden}.track i{display:block;background:#b9f377;height:100%;width:100%;transition:width .1s}#stage{position:relative;flex:1;min-height:0;margin:0 12px;border:1px solid #415344;border-radius:16px;overflow:hidden;background:#334345}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0c171ccc;backdrop-filter:blur(6px);padding:24px}.panel{text-align:center;max-width:390px}.eyebrow{color:#b9f377;font-size:11px;letter-spacing:3px}.panel h2{font-size:44px;line-height:1.08;letter-spacing:-2px;margin:18px 0}.panel p{color:#bdc9c3;line-height:1.8;font-size:14px}button{border:0;cursor:pointer;font:inherit;touch-action:none;-webkit-user-select:none;user-select:none}.primary{background:#b9f377;color:#172414;border-radius:12px;padding:16px 32px;font-weight:900;font-size:16px;margin-top:12px}.sub{display:block;margin-top:16px;font-size:11px;color:#83958c}.controls{padding:10px 18px max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;flex-shrink:0}.pad{display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(3,54px);gap:6px}.pad button{font-size:24px;border-radius:15px!important;-webkit-tap-highlight-color:transparent}.pad button.held{background:#597545; border-color:#b9f377;transform:scale(.96)}@media(max-height:560px){.pad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,38px);gap:4px}.controls{padding-top:5px;padding-bottom:max(6px,env(safe-area-inset-bottom))}}.pad button,.action{background:#27383b;border:1px solid #47605a;color:#e9f3e5;border-radius:9px;font-weight:800}.pad button:active,.action:active{background:#597545}.actions{display:flex;gap:8px}.action{height:64px;padding:0 17px;font-size:13px}.action em{font-style:normal;display:block;font-size:10px;color:#a4b5ac;margin-top:5px}.rage{border-color:#b9f377;color:#b9f377}.help{font-size:10px;color:#85978e;text-align:center;margin-left:8px;line-height:1.8}@media(max-width:540px){.help{display:none}header{padding-top:12px}h1{font-size:20px}.action{padding:0 12px}.panel h2{font-size:38px}}</style></head><body><div id="app"><header><div><h1>근육 개구리 <span style="color:#b9f377"></span></h1></div></header><div class="hud"><b id="progress">0 / 20 차선</b></div><div id="stage"><canvas id="c"></canvas><div id="overlay"><div class="panel"><h2 id="title"></h2><p id="desc"></p><button class="primary" id="start">도로로 뛰어들기 </button><span class="sub">방향키 / WASD 이동</span></div></div></div><div class="controls"><div class="pad"><button style="grid-column:2" data-m="0,1">▲</button><button style="grid-column:1;grid-row:2" data-m="-1,0">◀</button><button style="grid-column:2;grid-row:3" data-m="0,-1">▼</button><button style="grid-column:3;grid-row:2" data-m="1,0">▶</button></div></div></div><script>
(()=>{'use strict';const $=s=>document.getElementById(s),canvas=$('c'),ctx=canvas.getContext('2d');let W,H,dpr,mode='intro',player,cars=[],bits=[],texts=[],energy=100,rage=false,camera=0,time=0,last=0,shake=0,furthest=0,punchT=0,punchCD=0,inv=0,moveCD=0,trap=false,trapDone=false,endTimer=0;const keys=new Set();let heldDirection=null;function releaseDirection(){heldDirection=null;document.querySelectorAll('.pad .held').forEach(b=>b.classList.remove('held'))}const cell=48,lane=52;let audio;function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);function sound(freq=120,duration=.08,type='square'){try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.45,audio.currentTime+duration);g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}function sy(y){return H-88-(y-camera)*lane}function sx(x){return W/2+x*cell}function start(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}player={x:0,y:0,hp:3};cars=[];bits=[];texts=[];energy=100;rage=false;camera=0;time=0;furthest=0;punchT=0;punchCD=0;inv=0;moveCD=0;trap=false;trapDone=false;endTimer=0;keys.clear();for(let y=1;y<=20;y++){const dir=y%2?1:-1;const speed=65+(y%5)*20+Math.random()*30;for(let j=0;j<3;j++)cars.push({x:-W/2-180+j*(W+360)/3+Math.random()*40,y,dir,speed,w:52+Math.random()*24,color:['#e6b96b','#da7276','#a4c9cd','#788ae2','#d6e3d4'][y%5],dead:false})}mode='play';$('overlay').style.display='none';hud()}
function hud(){$('progress').textContent=Math.min(20,furthest)+' / 20 차선';}function note(t,color='#b9f377'){texts.push({t,x:sx(player.x),y:sy(player.y)-45,life:1.3,color})}function burst(x,y,color,n=16){for(let i=0;i<n;i++)bits.push({x,y,vx:(Math.random()-.5)*280,vy:(Math.random()-.5)*240,life:.4+Math.random()*.5,color,size:3+Math.random()*7})}function smash(c){c.dead=true;energy=Math.min(100,energy+6);burst(W/2+c.x,sy(c.y),c.color,22);shake=10;sound(85,.15,'sawtooth')}function punch(){if(mode!=='play'||punchCD>0)return;if(!rage){note('차에 부딪히면 자동으로 변신해요!');return}punchT=.24;punchCD=.35;sound(230,.09);for(const c of cars)if(!c.dead&&Math.abs(c.y-player.y)<=1.15&&Math.abs(c.x-player.x*cell)<c.w/2+80)smash(c)}function move(dx,dy){if(mode!=='play'||moveCD>0)return;player.x=Math.max(-Math.floor((W/2-22)/cell),Math.min(Math.floor((W/2-22)/cell),player.x+dx));player.y=Math.max(0,Math.min(22,player.y+dy));moveCD=.14;if(player.y>furthest){furthest=player.y}sound(340,.035,'sine')}
function finish(win){if(!win)return;mode='end';rage=false;keys.clear();releaseDirection();$('overlay').style.display='flex';$('title').innerHTML=win?'작은 개구리의<br><span style="color:#b9f377">거대한 승리.</span>':'도로는 강했다.<br><span style="color:#ffbc80">다시, 한 번 더.</span>';$('desc').textContent='도로 정복 완료!';$('start').textContent='다시 도전하기 ';hud()}

function update(dt){time+=dt;moveCD=Math.max(0,moveCD-dt);punchCD=Math.max(0,punchCD-dt);punchT=Math.max(0,punchT-dt);inv=Math.max(0,inv-dt);shake=Math.max(0,shake-dt*32);if(heldDirection)move(...heldDirection);else if(keys.has('ArrowUp')||keys.has('w'))move(0,1);else if(keys.has('ArrowDown')||keys.has('s'))move(0,-1);else if(keys.has('ArrowLeft')||keys.has('a'))move(-1,0);else if(keys.has('ArrowRight')||keys.has('d'))move(1,0);energy=Math.max(0,Math.min(100,energy+dt*(rage?-14:9)));if(!energy)rage=false;const target=Math.max(0,player.y-(H/lane)*.4);camera+=(target-camera)*Math.min(1,dt*9);if(player.y>=20&&!trap){trap=true;cars.push({x:-W/2-210,y:21,dir:1,speed:230,w:85,color:'#f3f4e9',dead:false,trap:true})}for(const c of cars){if(c.dead){if(c.trap)trapDone=true;continue}c.x+=c.dir*c.speed*dt;const edge=W/2+140;if(c.trap&&c.x>edge){c.dead=true;trapDone=true;continue}if(!c.trap&&Math.abs(c.x)>edge)c.x=-c.dir*edge;if(Math.abs(c.y-player.y)<.48&&Math.abs(c.x-player.x*cell)<c.w/2+(rage?18:11)){const wasRage=rage;rage=true;energy=100;punchCD=0;punch();if(!c.dead)smash(c);if(c.trap)trapDone=true;shake=15;burst(sx(player.x),sy(player.y),'#b9f377',12);if(!wasRage){note('간지럽노 ㅋ','#ffcd84');sound(190,.3,'sawtooth')} }}if(player.y===22&&trapDone){endTimer+=dt;if(endTimer>.55){finish(true)}}else endTimer=0;bits=bits.filter(b=>{b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=220*dt;return b.life>0});texts=texts.filter(t=>{t.life-=dt;t.y-=22*dt;return t.life>0});hud()}
function rect(x,y,w,h,color,r=0){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function frog(x,y){const big=rage,s=big?1.45:1;ctx.save();ctx.translate(x,y+Math.sin(time*10)*1.5);ctx.scale(s,s);ctx.globalAlpha=inv>0&&Math.floor(time*14)%2?.4:1;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,10,20,8,0,0,7);ctx.fill();if(big){rect(-20,-19,40,30,'#76bd59',9);rect(-31,-19,13,27,'#a3e477',7);rect(18,-19,13,27,'#a3e477',7);rect(-15,-15,13,12,'#b5ee86',4);rect(2,-15,13,12,'#b5ee86',4);rect(-10,0,8,6,'#a1dd70',2);rect(2,0,8,6,'#a1dd70',2)}rect(-18,5,12,10,'#538c45',4);rect(6,5,12,10,'#538c45',4);rect(-16,big?-36:-17,32,25,'#91d965',8);for(const ex of [-10,10]){rect(ex-6,big?-42:-23,12,13,'#bbed82',5);rect(ex-3,big?-39:-20,6,8,'#eef5d7',3);rect(ex-1,big?-37:-18,3,5,'#172a24',1)}rect(-6,big?-21:-2,12,2,'#254f35',1);if(punchT>0){rect(23,-29,23,16,'#c0f088',7);ctx.strokeStyle='#ffe5a0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-9,48,-2.8,.6);ctx.stroke()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);rect(0,0,W,H,'#577550');for(let y=0;y<=23;y++){const yy=sy(y);if(yy<-70||yy>H+70)continue;if(y>=1&&y<=20){rect(0,yy-lane/2,W,lane,y%2?'#34454b':'#3b4c51');ctx.strokeStyle=y%2?'#748078':'#cad4b080';ctx.lineWidth=2;ctx.setLineDash(y%2?[14,16]:[24,18]);ctx.beginPath();ctx.moveTo(0,yy-lane/2);ctx.lineTo(W,yy-lane/2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#dbe5d333';ctx.font='bold 10px system-ui';ctx.fillText(String(y).padStart(2,'0'),10,yy+4)}else{for(let i=0;i<W;i+=35){rect(i+((y*17)%25),yy+12,3,7,'#71915d');rect(i+9,yy-13,2,5,'#405f42')}if(y===0||y===22){ctx.fillStyle='#e4f1cf88';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText(y===0?'START · 작은 개구리의 큰 도전':'FINISH',W/2,yy-30);ctx.textAlign='left'}}}for(const c of cars){const y=sy(c.y),x=W/2+c.x;if(c.dead||y<-80||y>H+80)continue;rect(x-c.w/2+4,y-14,c.w,35,'#17292c55',7);rect(x-c.w/2+7,y-22,c.w-14,7,'#14272a',2);rect(x-c.w/2+7,y+14,c.w-14,7,'#14272a',2);rect(x-c.w/2,y-18,c.w,36,c.color,6);rect(x-c.w/2+15,y-14,c.w-31,28,'#223e4a',4);rect(x-c.w/2+21,y-15,c.w-42,30,c.color,3);rect(x+c.dir*(c.w/2-6)-2,y-13,4,8,'#fff4bc',1);rect(x+c.dir*(c.w/2-6)-2,y+5,4,8,'#fff4bc',1);if(c.trap){ctx.fillStyle='#ffda88';ctx.font='bold 11px system-ui';ctx.fillText('! LAST SURPRISE',x-48,y-32)}}if(player){if(rage){ctx.strokeStyle='#c8f99166';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(sx(player.x),sy(player.y)+5,39+Math.sin(time*9)*3,17,0,0,7);ctx.stroke()}frog(sx(player.x),sy(player.y))}for(const b of bits){ctx.globalAlpha=Math.min(1,b.life*2);rect(b.x,b.y,b.size,b.size,b.color,1)}ctx.globalAlpha=1;for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*3);ctx.fillStyle=t.color;ctx.font='900 16px system-ui';ctx.textAlign='center';ctx.fillText(t.t,Math.max(100,Math.min(W-100,t.x)),t.y)}ctx.globalAlpha=1;ctx.textAlign='left';ctx.restore();}
$('start').onclick=start;for(const b of document.querySelectorAll('[data-m]')){b.setAttribute('aria-label',({'0,1':'위로 이동','0,-1':'아래로 이동','-1,0':'왼쪽으로 이동','1,0':'오른쪽으로 이동'})[b.dataset.m]);b.onpointerdown=e=>{e.preventDefault();releaseDirection();b.setPointerCapture(e.pointerId);heldDirection=b.dataset.m.split(',').map(Number);b.classList.add('held');move(...heldDirection)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>{if(b.classList.contains('held'))releaseDirection()};b.oncontextmenu=e=>e.preventDefault()} window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(k))e.preventDefault();if(!e.repeat){if(k==='Enter'&&(mode==='intro'||mode==='end'))start()}keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>{keys.clear();releaseDirection()});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();releaseDirection()}});function loop(ts){const dt=Math.min(.04,(ts-last)/1000||.016);last=ts;if(mode==='play')update(dt);draw();requestAnimationFrame(loop)}resize();player={x:0,y:0,hp:3};requestAnimationFrame(loop);
})();</script></body></html>
